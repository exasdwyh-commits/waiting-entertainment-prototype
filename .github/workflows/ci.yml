name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Smoke test authoritative server and socket flow
        run: |
          npm run start -w server > /tmp/waiting-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3001/health | grep -q '"ok":true'; then
              echo "Authoritative server health check passed."
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              echo "Server failed to become healthy."
              cat /tmp/waiting-server.log
              exit 1
            fi
            sleep 0.5
          done

          node client/test/socket-smoke.mjs
