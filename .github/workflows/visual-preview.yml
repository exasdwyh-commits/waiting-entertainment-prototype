name: Visual Preview

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "client/**"
      - "player/**"
      - "host/**"
      - "screen/**"
      - "guest/**"
      - "server/**"
      - "shared/**"
      - "scripts/capture-preview.mjs"
      - ".github/workflows/visual-preview.yml"
  pull_request:
    paths:
      - "client/**"
      - "player/**"
      - "host/**"
      - "screen/**"
      - "guest/**"
      - "server/**"
      - "shared/**"
      - "scripts/capture-preview.mjs"
      - ".github/workflows/visual-preview.yml"

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install project dependencies
        run: npm install

      - name: Install screenshot runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start Waiting Entertainment
        env:
          WAITING_ROUND_MS: 18000
        run: |
          npm run dev > /tmp/waiting-preview.log 2>&1 &
          echo $! > /tmp/waiting-preview.pid

      - name: Wait for local services
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3001/health >/dev/null \
              && curl -fsS http://127.0.0.1:5173 >/dev/null \
              && curl -fsS http://127.0.0.1:5174 >/dev/null \
              && curl -fsS http://127.0.0.1:5175 >/dev/null \
              && curl -fsS http://127.0.0.1:5176 >/dev/null \
              && curl -fsS http://127.0.0.1:5177 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/waiting-preview.log
          exit 1

      - name: Capture big-screen and phone screenshots
        run: node scripts/capture-preview.mjs

      - name: Upload visual preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: visual-preview
          path: docs/screenshots/*.png
          if-no-files-found: error

      # Artifact-only policy: this workflow must never commit or push.
      # The old auto-commit step raced concurrent commits on main and failed
      # with non-fast-forward even though capture + upload succeeded.
      # To refresh repo screenshots, capture locally and commit manually.
